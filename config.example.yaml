# panbot 配置模板。复制为 config.yaml 后填写；config.yaml 不要提交到 git。

# 每天要上传的图片目录（也可以用 --source 临时指定）
# Windows 路径写法：用单引号 'E:\图片\今日'（反斜杠无需转义），或用正斜杠 "E:/图片/今日"
source_dir: "D:/images/daily"

# 参与上传的图片扩展名
extensions: [jpg, jpeg, png, gif, webp, bmp, avif, heic]

# 网盘内子目录名模板，{date} 会被替换成当天日期（或 --date 传入的日期）
date_dir: "{date}"

# 分享设置
share:
  days: 30            # 有效期天数：0=永久（百度/迅雷），夸克会映射到 永久/1天/7天/30天
  title: "{name} {date} 图片分享"   # {name}=--name 传入的文件夹名，{date}=日期
  password: ""        # 百度提取码留空会自动生成；夸克默认生成公开链接（无私密链接见下）
  # private: true     # 仅夸克有效：true=私密分享（带提取码），false=公开链接

# 结果输出（相对于本配置文件所在目录）
output:
  markdown: links.md
  csv: links_log.csv

# ---------- 百度网盘 ----------
baidu:
  enable: true
  # 开放平台应用（pan.baidu.com/union 免费注册）：用于上传
  app_name: ""        # 应用名（可选，仅沙箱模式需要）
  root: "/"           # 上传根目录："/"=网盘根目录；沙箱应用填 "/apps/<应用名>"
  folder: "上传图/{name}"   # {name}=运行时 --name 指定；也支持 {date}；不含 {name} 则无需 --name
  app_key: ""
  secret_key: ""
  # 浏览器 cookie（用于创建分享链接，F12 → Application → Cookies → BDUSS）
  bduss: ""
  stoken: ""          # 可选，建议一并填上更稳

# ---------- 夸克网盘 ----------
quark:
  enable: true
  folder: "上传图/{name}"   # {name}=运行时 --name 指定；也支持 {date}
  # 浏览器登录 pan.quark.cn 后，F12 → Network → 任意请求 → 复制整条 Cookie
  cookie: ""
  share:
    private: false    # false=公开链接（推广常用），true=带提取码
  # 生成推广"口令"（形如 /~xxxxxxxxxx~:/，需要本机夸克客户端配合签名）
  cmd_token: true
  client_exe: ""   # 夸克客户端 quark.exe 的完整路径（按实际安装位置填写）
  client_debug_port: 9222
  client_autostart: false   # 端口没开时是否自动带调试参数拉起客户端

# ---------- 迅雷云盘 ----------
xunlei:
  enable: true
  folder: "星铁の图/{name}"   # {name}=运行时 --name 指定；也支持 {date}
  # 登录 pan.xunlei.com 后 F12 控制台执行（README 有完整命令）提取 refresh_token
  refresh_token: ""
  # 网页版客户端参数（与登录页签发的 token 配套），一般不用改
  client_id: "Xqp0kJBXWhwaTpB6"
  client_secret: ""
  client_version: "1.45.0"
  package_name: "pan.xunlei.com"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36"
  # 网页版固定签名三元组（device_id/captcha_sign/captcha_timestamp 必须配套，勿单独修改）
  device_id: "925b7631473a13716b791d7f28289cad"
  captcha_sign: "1.fe2108ad808a74c9ac0243309242726c"
  captcha_timestamp: "1645241033384"
